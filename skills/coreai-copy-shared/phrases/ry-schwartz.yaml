name: "Ry Schwartz - Signature Phrases"
version: "1.0.0"
source:
  books:
    - "Coaching The Conversion Method"
    - "TCC Podcast"
    - "Copyhackers Launch Email Tutorial"
  author: "Ry Schwartz"
description: >
  Frases icônicas do Ry Schwartz organizadas por categoria, com fonte e contexto de uso.

core_philosophy:
  - phrase: "Pressure plus pressure equals overwhelm equals shutdown"
    source: "Coaching The Conversion"
    context: "Por que não adicionar pressão no cart close"
  - phrase: "Coach the conversion, don't sell it"
    source: "Coaching The Conversion"
    context: "Metodologia central"
  - phrase: "Help them become the perfect buyer"
    source: "Coaching The Conversion"
    context: "Objetivo da copy"
  - phrase: "The right decision for YOU"
    source: "Coaching The Conversion"
    context: "Venda ética no cart close"

methodology_related:
  - phrase: "Get in the habit of listening to enrollment calls"
    source: "TCC Podcast"
    context: "Método de pesquisa"
  - phrase: "Lighten the mood while encouraging action"
    source: "Coaching The Conversion"
    context: "Técnica de cart close"
  - phrase: "Automated intimacy - scale and personal aren't opposites"
    source: "Coaching The Conversion"
    context: "Filosofia de email sequences"
  - phrase: "Real urgency, not manufactured scarcity"
    source: "Coaching The Conversion"
    context: "Urgência real em cohort-based courses"

qualification_related:
  - phrase: "Who this is for, who this is NOT for"
    source: "Coaching The Conversion"
    context: "Copy de qualificação"
  - phrase: "If the timing isn't right, I genuinely want you to wait"
    source: "Coaching The Conversion"
    context: "Permissão para não comprar - reduz pressão"
  - phrase: "You won't be doing this alone"
    source: "Coaching The Conversion"
    context: "Valor da comunidade no formato cohort"

deep_psychology:
  - phrase: "What does the reader need to forgive themselves for in order to buy?"
    source: "TCC Podcast"
    context: "Forgiveness Framework - remover resistência oculta"
  - phrase: "I don't write until I feel like crap...until I have this guttural visceral reaction"
    source: "TCC Podcast Episode 33"
    context: "70/30 Rule - imersão emocional na pesquisa"
  - phrase: "Copy is catalyzing a conversation that happens in your prospect's head"
    source: "Coaching The Conversion"
    context: "Definição de copywriting"
  - phrase: "Let the timer be the timer, and then you get to be the human"
    source: "Email Swipes Podcast"
    context: "Terceirizar pressão para countdown tools"
  - phrase: "Never be benign, and don't be afraid to invoke people's emotions"
    source: "Coaching The Conversion"
    context: "Copy emocional com intenção"

copywriter_wisdom:
  - phrase: "Writing copy for clients is the most intimate thing you could do in business with your pants still on"
    source: "TCC Podcast Episode 2"
    context: "Definindo a relação copywriter-cliente"
  - phrase: "By leading with your own concern, your prospects are more likely to feel okay getting in touch with their own"
    source: "Copyhackers Launch Email Tutorial"
    context: "Mecanismo de Reverse FOMO"
  - phrase: "Would I actually say this out loud in person with any level of self respect?"
    source: "Email Swipes Podcast"
    context: "Teste de humanização"
  - phrase: "No one wakes up with their credit card in hand, excited to spend hundreds or thousands of dollars"
    source: "Coaching The Conversion"
    context: "Entendendo psicologia do comprador"
  - phrase: "Everyone should feel better for having had a touch point with your brand"
    source: "Coaching The Conversion"
    context: "Filosofia de experiência de marca"
  - phrase: "Specificity is the quickest way to improve anything, copywriting included"
    source: "Coaching The Conversion - MOHT Framework"
    context: "Especificidade como alavanca"

throne_phrase: "Coach the conversion, don't sell it"
