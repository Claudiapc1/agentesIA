      familias_proibidas: [negacao-conceitual]
      teste_obrigatorio: checklists/carta-vs-pagina.md
      excecao_declarada: "curiosidade-em-loop liberada, unica excecao dos 16"
      razao_da_excecao: "O corpo da pagina e o video, e o video fecha o loop na propria pagina. Em todo outro tipo o loop fica aberto e a pessoa sai. Ainda assim passa pelo teste dos 3 segundos: a pessoa precisa saber por que apertar play"

    pagina-vendas-oto:
