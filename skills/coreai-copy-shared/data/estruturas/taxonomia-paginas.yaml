# ---------------------------------------------------------------------------
# HEADLINE POR TIPO
#
# ORIGEM: SINKRA Fase 2 secao 6.3 especificou o formato do bloco. A Fase 4
# secao 3.3 (camada 2) o declarou como campo obrigatorio da taxonomia e o
# criterio C5 do criterio de pronto. A Fase 5 verificou que ele nao existia no
# disco e que a ausencia quebrava a pre-condition da task T04.
# PREENCHIDO na Fase 6, em 2026-08-23, fechando o gap 3.
#
# FORMATO CANONICO, quatro campos por tipo, conforme Fase 4 secao 3.3:
#   banco, familias_permitidas, familias_proibidas, teste_obrigatorio
#
# VOCABULARIO DE FAMILIAS: e o da Fase 2 secao 6.3, nao o dos 10 tipos AWAI.
# As familias descrevem O QUE A HEADLINE FAZ COM A INFORMACAO, que e o eixo
# que separa carta de pagina. Os 10 tipos AWAI de headlines-ganchos.md
# descrevem o angulo retorico, que e outro eixo e nasceu de carta.
#
#   promessa-direta      diz o resultado sem rodeio
#   promessa-com-produto nomeia o produto dentro da promessa
#   resultado-especifico numero, prazo ou metrica no topo
#   curiosidade-em-loop  esconde para obrigar a ler, fecha paragrafos depois
#   negacao-conceitual   "a razao pela qual X nao tem nada a ver com X"
#
# FONTES, nada inventado:
#   Fase 4 secao 3.3, o bloco de quatro campos e as duas familias proibidas
#   Fase 4 criterio C5: "minimo_aceitavel: familias_proibidas contem
#     curiosidade-em-loop e negacao-conceitual"
#   frameworks/torriani/headlines-ganchos.md linhas 30 a 51: origem_de_peca
#     carta, destino_ausente, familias_proibidas_em_pagina
#   checklists/carta-vs-pagina.md: teste dos 3 segundos, nome do produto no topo
#
# A REGRA MINIMA, valida para os 16 tipos, sem excecao:
#   curiosidade-em-loop e negacao-conceitual sao proibidas em TODA pagina.
#   A headline reprovada pelo founder em 22/08/2026 era negacao-conceitual.
#   A proibicao por declaracao mata a reprovacao na origem, sem depender de
#   julgamento no gate.
#
# BANCO: [DEPENDÊNCIA NÃO EMPACOTADA: swipe-file-headlines-pagina] ainda NAO EXISTE (camada 3, Fase 6).
#   Enquanto nao existir, o arsenal de carta atende pagina por emprestimo, e a
#   familia da formula clonada precisa ser declarada na saida (V7). O campo
#   banco ja aponta para o alvo, nao para o emprestimo, porque o alvo e o
#   destino declarado e o emprestimo e degradacao temporaria.
# ---------------------------------------------------------------------------

headline_por_tipo:

  regra_global:
    familias_proibidas_em_toda_pagina: [curiosidade-em-loop, negacao-conceitual]
    teste_obrigatorio: "checklists/carta-vs-pagina.md"
    nome_do_produto: "entra na headline. Esconder o produto no topo funciona em carta, em pagina e so custo"
    lastro: "clone de campea real, com a tabela de fidelidade estrutural fechada elemento a elemento"
    banco_alvo: "[DEPENDÊNCIA NÃO EMPACOTADA: swipe-file-headlines-pagina]"
    banco_de_emprestimo: "frameworks/torriani/headlines-ganchos.md, sob origem_de_peca carta"
    veto: "V7. Headline sem declaracao de qual campea real foi clonada e headline inventada"

  tipos:

    pagina-vendas-perpetuo:
      banco: [DEPENDÊNCIA NÃO EMPACOTADA: swipe-file-headlines-pagina]
      familias_permitidas: [promessa-direta, promessa-com-produto, resultado-especifico]
      familias_proibidas: [curiosidade-em-loop, negacao-conceitual]
      teste_obrigatorio: checklists/carta-vs-pagina.md
      nota: "Trafego continuo e frio. As tres permitidas servem igualmente, a escolha e do executor"

    pagina-vendas-geral:
      banco: [DEPENDÊNCIA NÃO EMPACOTADA: swipe-file-headlines-pagina]
      familias_permitidas: [promessa-direta, resultado-especifico]
      familias_proibidas: [curiosidade-em-loop, negacao-conceitual]
      teste_obrigatorio: checklists/carta-vs-pagina.md
      nota: "Venda direta sem contexto de lancamento nem evento. O tipo mais nu da familia"

    pagina-vendas-lancamento:
      banco: [DEPENDÊNCIA NÃO EMPACOTADA: swipe-file-headlines-pagina]
      familias_permitidas: [promessa-com-produto, resultado-especifico]
      familias_proibidas: [curiosidade-em-loop, negacao-conceitual]
      teste_obrigatorio: checklists/carta-vs-pagina.md
      nota: "Publico ja consumiu os PLCs e conhece o produto pelo nome. A headline fecha, nao apresenta"

