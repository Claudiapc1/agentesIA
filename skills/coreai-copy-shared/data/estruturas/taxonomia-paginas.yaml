    pagina-comparacao:
      banco: [DEPENDÊNCIA NÃO EMPACOTADA: swipe-file-headlines-pagina]
      familias_permitidas: [promessa-com-produto, resultado-especifico]
      familias_proibidas: [curiosidade-em-loop, negacao-conceitual]
      teste_obrigatorio: checklists/carta-vs-pagina.md
