      familias_permitidas: [promessa-direta, resultado-especifico]
      familias_proibidas: [curiosidade-em-loop, negacao-conceitual]
      teste_obrigatorio: checklists/carta-vs-pagina.md
      nota: "A promessa e a entrega do material, nao a compra. promessa-com-produto fora: o produto nao esta em jogo aqui, a isca esta"

    pagina-registro-evento:
      banco: [DEPENDÊNCIA NÃO EMPACOTADA: swipe-file-headlines-pagina]
      familias_permitidas: [promessa-direta, promessa-com-produto]
      familias_proibidas: [curiosidade-em-loop, negacao-conceitual]
      teste_obrigatorio: checklists/carta-vs-pagina.md
      nota: "A headline diz o evento, a data e o que a pessoa aprende. Data e lugar sao parte do objeto"

