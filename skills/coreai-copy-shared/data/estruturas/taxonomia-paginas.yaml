    pagina-obrigado:
      banco: [DEPENDÊNCIA NÃO EMPACOTADA: swipe-file-headlines-pagina]
      familias_permitidas: [promessa-direta]
      familias_proibidas: [curiosidade-em-loop, negacao-conceitual, resultado-especifico]
      teste_obrigatorio: checklists/carta-vs-pagina.md
