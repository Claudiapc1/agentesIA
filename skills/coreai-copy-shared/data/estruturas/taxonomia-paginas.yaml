# taxonomia-paginas.yaml
#
# INDICE CANONICO dos tipos de pagina do squad Copy.
#
# Este arquivo responde uma pergunta so: o founder pediu uma pagina, qual estrutura roda?
# Quem consome: o quarto eixo do roteamento (formato de peca), o Copy Chief, e o
# checklist checklists/estrutura-pagina.md no Gate 1.
#
# ORIGEM: pipeline SINKRA, processo estruturas-de-pagina-squad-copy.
#   Fase 1 (Discovery)    docs/sinkra/01-discovery-estruturas-pagina.md
#   Fase 2 (Architecture) docs/sinkra/02-architecture-estruturas-pagina.md, taxonomia dos 16 tipos
#   Fase 3 (Executors)    docs/sinkra/03-executors-estruturas-pagina.md, matriz de executores corrigida
#
# REGRA DE EDICAO: nao editar a mao sem registrar em qual fase a mudanca foi decidida.
# Tipo novo entra com status declarado e origem declarada, nunca solto.

meta:
  versao: "1.0.0"
  criado_em: "2026-08-22"
  fonte: "SINKRA Fases 1 a 3"
  total_tipos: 17
  familias: [pagina, carta, elemento]

# ---------------------------------------------------------------------------
# FAMILIAS: a familia governa o gate de formato
# ---------------------------------------------------------------------------

familias:
  pagina:
    o_que_e: "Peca de tela, leitura em scroll, blocos visuais, trafego frequentemente frio"
    gate: "Trava formato=pagina. Teste dos 3 segundos obrigatorio no topo"
  carta:
    o_que_e: "Peca de leitura corrida, lead longo, curiosidade em loop"
    gate: "Rota legitima, alcancavel SO por pedido explicito de carta"
    workflow: "workflows/workflow-carta-vendas-obrigatorio.md"
  elemento:
    o_que_e: "Componente dentro de outra pagina, nao e pagina autonoma"
    gate: "Sem gate proprio, herda o da pagina hospedeira"

# ---------------------------------------------------------------------------
# DESEMPATE: quando dois tipos disputam, vale a regra escrita
# ---------------------------------------------------------------------------

desempate:
  - regra: "So e lancamento se existir sequencia de PLCs consumida antes. Sem PLC, e perpetuo"
    entre: [pagina-vendas-lancamento, pagina-vendas-perpetuo]
  - regra: "Se o objeto tem data e lugar, e evento. Se vende todo dia, e perpetuo"
    entre: [pagina-vendas-evento, pagina-vendas-perpetuo]
  - regra: "Preco baixo, decisao rapida, sem escada antes: tripwire"
    entre: [pagina-vendas-tripwire, pagina-vendas-geral]
  - regra: "Se o objeto vendido e o programa, e aplicacao. Se o objeto e a conversa, e diagnostico-sessao"
    entre: [pagina-aplicacao, pagina-diagnostico-sessao]
  - regra: "Se entrega material, e captura. Se inscreve em evento com data, e registro-evento"
    entre: [pagina-captura, pagina-registro-evento]

default_sem_qualificar: pagina-vendas-perpetuo

