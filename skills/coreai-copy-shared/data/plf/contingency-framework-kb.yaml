# Contingency Framework Knowledge Base - Product Launch Formula
# Source: Launch (Jeff Walker) + Launch Operation Best Practices
# Version: 1.0

metadata:
  source: "Launch by Jeff Walker + PLF Community Learnings"
  validated: true
  created: "2026-01-27"

overview:
  description: |
    Framework de contingencia para lançamentos PLF,
    cobrindo cenarios de problemas tecnicos, baixo engajamento,
    crises e situações inesperadas.
  jeff_principle: |
    "Things will go wrong. They always do. The question isn't IF
    something will break - it's whether you're prepared to handle it."

tech_failures:
  email_issues:
    problem: "Emails não estão sendo entregues"
    symptoms:
      - "Open rate muito baixo (< 10%)"
      - "Bounces aumentando"
      - "Subscribers reclamando que não receberam"
    immediate_actions:
      - "Verificar status do provedor de email"
      - "Checar se emails cairam em spam"
      - "Enviar teste para contas pessoais"
      - "Verificar DNS records (SPF, DKIM, DMARC)"
    contingency:
      - "Ter backup de lista em CSV"
      - "Conta secundaria de email configurada"
      - "Template pronto para envio manual se necessário"
      - "Post em social média como backup"
    prevention:
      - "Aquecer IP novo antes do lançamento"
      - "Limpar lista de inativos antes"
      - "Testar deliverability 1 semana antes"

  payment_processor_down:
    problem: "Checkout não esta funcionando"
    symptoms:
      - "Clientes reportando erro no pagamento"
      - "Zero vendas apesar de cliques"
      - "Erros de processamento"
    immediate_actions:
      - "Verificar status do Stripe/PayPal"
      - "Testar compra você mesmo"
      - "Verificar integração com landing page"
      - "Checar certificado SSL"
    contingency:
      - "Ter segundo processador configurado (PayPal se Stripe e principal)"
      - "Página de backup com link alternativo"
      - "Processo manual para emergencias"
    communication:
      template: |
        "Ei [Nome],

        Estamos com um problema técnico temporario no checkout.
        Minha equipe esta resolvendo agora.

        Se você tentou comprar e não conseguiu:
        1. Tente novamente em [X] minutos
        2. OU use este link alternativo: [backup link]
        3. OU responda este email que te ajudamos manualmente

        Desculpa pelo inconveniente. Já estamos resolvendo.

        [Assinatura]"

  sales_page_down:
    problem: "Página de vendas fora do ar"
    immediate_actions:
      - "Verificar status do hosting"
      - "Checar se dominio expirou"
      - "Verificar CDN/cloudflare"
      - "Limpar cache"
    contingency:
      - "Backup da página em servidor diferente"
      - "Versão simplificada pronta (até Google Doc)"
      - "Landing page alternativa configurada"
    prevention:
      - "Testar sob carga antes do lançamento"
      - "Hosting com boa reputação"
      - "Monitoramento de uptime configurado"

  video_platform_issues:
    problem: "Videos dos PLCs não carregam"
    immediate_actions:
      - "Verificar status do Vimeo/YouTube/host"
      - "Testar em diferentes navegadores"
      - "Checar se e problema de embedding"
    contingency:
      - "Videos hospedados em 2 plataformas"
      - "Versão em texto/transcript pronta"
      - "Audio como alternativa"
    communication:
      template: |
        "[Nome],

        O video de hoje esta temporariamente indisponivel.
        Enquanto resolvemos, aqui esta a versão em texto/audio: [link]

        O video volta em breve. Você será notificado.

        [Assinatura]"

low_engagement:
  low_open_rates:
    problem: "Open rates abaixo de 20%"
    diagnosis:
      - "Subject lines não estão funcionando"
      - "Lista esta fria"
      - "Horario de envio ruim"
      - "Problema de deliverability"
    immediate_actions:
      - "Testar novos subject lines"
      - "Reenviar para não-abridores com subject diferente"
      - "Ajustar horario de envio"
      - "Verificar pasta de spam"
    recovery:
      - "Email de 'você viu isso?' mais pessoal"
      - "Social média para complementar"
      - "SMS se tiver lista (cuidado com frequência)"

  low_plc_consumption:
    problem: "Pessoas não estão assistindo os PLCs"
    diagnosis:
      - "PLCs muito longos"
      - "Conteúdo não esta ressonando"
      - "Tech barrier (video não carrega)"
      - "Timing ruim"
    immediate_actions:
      - "Criar versão resumida"
      - "Oferecer transcript/audio"
      - "Destacar os pontos principais em email"
      - "Criar urgência para consumir"
    recovery:
      email_template: |
        "[Nome],

        Percebi que você ainda não assistiu [PLC X].

        Eu sei que [X] minutos pode parecer muito, mas deixa eu te dar o resumo:

        Ponto 1: [...]
        Ponto 2: [...]
        Ponto 3: [...]

        Se você só tiver 5 minutos, assista a partir do minuto [X].
        E a parte mais importante.

        [Link]

        [Assinatura]"

  low_engagement_comments:
    problem: "Nenhum comentario ou interação nos PLCs"
    diagnosis:
      - "CTA de comentario não esta claro"
      - "Pergunta muito genérica"
      - "Audiência muito passiva"
    immediate_actions:
      - "Fazer pergunta mais específica"
      - "Comentar você mesmo para iniciar"
      - "Responder os primeiros comentarios pessoalmente"
    recovery:
      - "Email pedindo feedback direto"
      - "Enquete simples (A ou B)"
      - "Oferecer bonus para quem comentar"

low_sales:
  day_1_below_expectations:
    problem: "Vendas no dia 1 muito abaixo do esperado"
    diagnosis_questions:
      - "A landing page esta funcionando?"
      - "O checkout esta processando?"
      - "Os emails foram entregues?"
      - "O preço esta muito alto?"
      - "A oferta esta confusa?"
    immediate_actions:
      - "Verificar tech (tudo funcionando?)"
      - "Enviar email extra no fim do dia"
      - "Postar em social média"
      - "Checar se objeções não foram respondidas"
    recovery:
      - "Email de 'primeiras vagas preenchidas' se houver vendas"
      - "Adicionar urgency element se não tinha"
      - "FAQ addressing objeções"
      - "Live Q&A improvisado"

  mid_launch_stall:
    problem: "Vendas pararam no meio do lançamento"
    normal_context: |
      "Isso é NORMAL. 25% no dia 1, 25% nos dias do meio,
      50% no último dia. O 'valley' no meio é esperado."
    when_to_worry:
      - "Zero vendas por 2+ dias seguidos"
      - "Unsubscribes muito altos"
      - "Feedback negativo significativo"
    actions:
      - "Manter a cadencia de emails"
      - "Adicionar case study extra"
      - "Fazer live Q&A"
      - "Teaser do que vem no último dia"

  last_day_disappointing:
    problem: "Último dia não trouxe o esperado 50%"
    diagnosis:
      - "Escassez não foi percebida como real"
      - "Objeções finais não foram respondidas"
      - "Preço é barreira intransponível"
      - "Audiência não estava pronta"
    immediate_actions:
      - "Mais emails (se não enviou os 3-4 planejados)"
      - "Estender deadline em algumas horas (one-time, com justificativa)"
      - "Oferta de payment plan de última hora"
    post_mortem:
      - "Documentar aprendizados"
      - "Survey para quem não comprou"
      - "Ajustar para próximo lançamento"

  total_launch_failure:
    problem: "Lançamento foi um fracasso completo"
    definition: "Menos de 50% do mínimo esperado"
    immediate:
      - "Não entre em panico publicamente"
      - "Complete o lançamento com dignidade"
      - "Agradecer quem comprou"
    analysis:
      questions_to_ask:
        - "A lista estava aquecida?"
        - "O produto resolve um problema real?"
        - "A oferta era clara e atraente?"
        - "O preço estava certo para o mercado?"
        - "Os PLCs entregaram valor?"
        - "As objeções foram respondidas?"
    recovery_options:
      - "Survey para entender o gap"
      - "Pivotar a oferta"
      - "Seed Launch para validar"
      - "Refazer PLCs com feedback"
    jeff_perspective: |
      "A failed launch is expensive tuition, but it's tuition nonetheless.
      The lessons you learn will make your next launch better."

crisis_management:
  negative_feedback:
    problem: "Criticas publicas ou reclamações"
    types:
      legitimate_complaint:
        response: |
          "Obrigado pelo feedback, [Nome].
          Você tem razão sobre [ponto válido].
          Já estamos [ação corretiva].
          Posso te ajudar pessoalmente com [solução]?"
        private_follow_up: true

      troll_attack:
        response: "Ignorar ou responder uma vez educadamente, depois ignorar"
        do_not: "Entrar em discussao publica"

      competitor_sabotage:
        response: "Documentar, ignorar publicamente, agir legalmente se necessário"

    general_rules:
      - "Responder rápido (dentro de horas)"
      - "Não ser defensivo"
      - "Levar para privado quando possível"
      - "Corrigir erros genuinos publicamente"

  refund_requests:
    during_launch:
      policy: "Processar rapidamente, sem atrito"
      response_template: |
        "[Nome],

        Pedido de reembolso processado.
        O valor será estornado em [X] dias úteis.

        Se quiser compartilhar o que não funcionou para você,
        agradeco o feedback - ajuda a melhorar para os próximos.

        Sem ressentimentos. Desejo sucesso.

        [Assinatura]"

    high_refund_rate:
      threshold: "> 10%"
      diagnosis:
        - "Expectativas não alinhadas?"
        - "Produto não entregou promessa?"
        - "Onboarding confuso?"
      action: "Pausar e investigar antes de continuar"

  external_events:
    problem: "Evento externo afeta o lançamento (crise, noticia, desastre)"
    options:
      pause_launch:
        when: "Evento maior incompativel com vender"
        how: "Comunicar com empatia, pausar, retomar depois"
      continue_adjusted:
        when: "Evento menor, ajustar tom"
        how: "Reconhecer momento, adaptar messaging"
      continue_normal:
        when: "Evento não relacionado ao seu mercado"
        how: "Seguir normalmente mas estar atento"

communication_templates:
  tech_issue_announcement:
    template: |
      "Ola [Nome],

      Estamos enfrentando um problema técnico com [sistema].
      Minha equipe esta trabalhando para resolver o mais rápido possível.

      O que você precisa saber:
      - [Status atual]
      - [Estimativa de resolução]
      - [O que fazer enquanto isso]

      Vou te atualizar assim que estiver resolvido.

      Desculpa pelo inconveniente.

      [Assinatura]"

  deadline_extension:
    template: |
      "Ola [Nome],

      Por causa de [razão legitima - problema técnico/pedidos],
      decidi estender o prazo do [Produto] por mais [X] horas.

      O novo deadline e [data/hora].

      Se você estava tentando entrar e não conseguiu,
      agora tem mais uma chance.

      Depois de [novo deadline], a porta fecha de verdade.

      [Link]

      [Assinatura]"
    warning: |
      "Use com MUITA parcimônia. Extensoes frequentes
      destroem credibilidade da escassez."

  launch_cancellation:
    template: |
      "Ola [Nome],

      Preciso te contar algo difícil.

      Decidi adiar/cancelar o lançamento do [Produto].

      O motivo: [razão honesta - não esta pronto / feedback indicou necessidade de ajustes / situacao pessoal].

      Se você estava animado para participar, eu entendo a frustração.
      Quero fazer isso direito, não só fazer rápido.

      [Próximo passo - quando volta / reembolsos se aplicavel]

      Obrigado pela paciência e confiança.

      [Assinatura]"

pre_launch_checklist:
  tech_readiness:
    - item: "Email platform testada e aquecida"
      backup: "Conta secundaria configurada"
    - item: "Landing page funcionando"
      backup: "Página backup pronta"
    - item: "Checkout processando"
      backup: "Processador alternativo configurado"
    - item: "Videos hospedados e carregando"
      backup: "Plataforma secundaria"
    - item: "Automacoes testadas end-to-end"
      backup: "Processo manual documentado"

  content_readiness:
    - item: "Todos os PLCs gravados/finalizados"
    - item: "Todos os emails escritos"
    - item: "Sales page completa"
    - item: "FAQ preparado"
    - item: "Testimonials coletados"

  support_readiness:
    - item: "Time de suporte briefado"
    - item: "Templates de resposta prontos"
    - item: "Escalonamento definido"
    - item: "Horarios de cobertura definidos"

monitoring_during_launch:
  metrics_to_watch:
    hourly:
      - "Vendas"
      - "Erros de checkout"
      - "Email bounces"
    daily:
      - "Open rates"
      - "Click rates"
      - "Conversion rate"
      - "Unsubscribes"
      - "Refund requests"

  alert_thresholds:
    critical:
      - "Zero vendas por 6+ horas (em horario comercial)"
      - "Bounce rate > 5%"
      - "Checkout errors > 2%"
    warning:
      - "Open rate < 20%"
      - "Click rate < 3%"
      - "Refund rate > 5%"
