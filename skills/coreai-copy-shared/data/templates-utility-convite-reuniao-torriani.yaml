# ----------------------------------------------------------------------------
# SEQUENCIA RECOMENDADA DE DISPARO
# ----------------------------------------------------------------------------
sequencia:
  - dia: "D+0 (logo apos o formulário)"
    template: "analise_ia_solicitacao_registrada"
    objetivo: "Confirmar que o pedido entrou. Abre a conversa."
  - dia: "D+1"
    template: "analise_ia_vaga_reservada"
    objetivo: "O mais forte do lote. Da peso ao ato do lead e pede o horário."
  - dia: "D+3"
    template: "analise_ia_pauta_registrada"
    objetivo: "Entrega valor antecipado pra quem nao respondeu."
  - dia: "D+5"
    template: "analise_ia_status_pendente"
    objetivo: "Reduz a acao a uma informação so."
  - dia: "D+8"
    template: "analise_ia_aviso_fila"
    objetivo: "Custo de nao responder, sem ameaca."
  - dia: "D+12"
    template: "analise_ia_confirmacao_interesse"
    objetivo: "Binario com saida honrosa. Limpa a base."
  - dia: "D+15"
    template: "analise_ia_encerramento_registro"
    objetivo: "Ultimo. So se a política de encerramento for real."

# ----------------------------------------------------------------------------
# LEMBRETE OPERACIONAL
# ----------------------------------------------------------------------------
janela_24h: |
  Assim que o lead responde qualquer um desses templates, abre a janela de
  24 horas e voce fala livre, sem template e sem custo por mensagem.

  O template nao precisa vender. Precisa gerar UMA resposta.
  A venda inteira acontece dentro da janela, na regua que ja existe em
  swipe/mensagens-convite-reuniao-torriani.md.
