# ----------------------------------------------------------------------------
# O FATO QUE SUSTENTA O ENQUADRAMENTO UTILITY
# ----------------------------------------------------------------------------
fato_gerador: |
  O lead enviou a palavra-chave AGENTE no Instagram e preencheu o formulário
  pedindo uma análise de IA aplicada a marketing, copy e conteúdo. Esse ato cria uma solicitação
  real no sistema, com data e protocolo.

  Toda mensagem abaixo notifica o ESTADO dessa solicitação. Nenhuma inventa
  compromisso que não existe. Sem esse ato anterior, nada aqui é Utility.

# ----------------------------------------------------------------------------
# ANTES DE SUBMETER
# ----------------------------------------------------------------------------
checklist_submissao:
  - "Gerar protocolo real no momento do preenchimento do formulário (ex: AIA-4471)"
  - "Registrar a data do preenchimento e usar ela na variavel de data"
  - "Definir a política real de validade do registro antes de usar os templates de expiracao"
  - "Preencher exemplo real de cada variavel na submissao (a Meta exige)"
  - "Submeter como UTILITY, idioma pt_BR"
  - "Se reprovar, o motivo quase sempre e adjetivo de venda no corpo: revisar e resubmeter"

