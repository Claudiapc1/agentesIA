# The Secret Formula - Russell Brunson
# Source: DotCom Secrets
# Category: strategy_foundation

name: "The Secret Formula"
version: "1.0"
source: "Russell Brunson - DotCom Secrets"
category: "strategy_foundation"
command: "*secret-formula"

description: |
  4 perguntas fundamentais antes de criar qualquer funil.
  Se voce nao sabe responder essas 4 perguntas, nao esta
  pronto para criar nada.

questions:
  who:
    question: "QUEM e seu cliente dos sonhos?"
    depth: "Crie um avatar detalhado com desejos, medos, frustracoes"

  where:
    question: "ONDE eles estao se congregando online?"
    depth: "Blogs, podcasts, grupos, influencers que eles seguem"

  bait:
    question: "Qual ISCA vai atrai-los?"
    depth: "O que voce pode oferecer que eles irresistivelmente querem?"

  result:
    question: "Qual RESULTADO voce pode dar a eles?"
    depth: "A transformacao que seu produto proporciona"

process:
  step_1: "Responda QUEM com detalhes obsessivos"
  step_2: "Pesquise ONDE eles estao (Dream 100)"
  step_3: "Crie ISCA irresistivel para atrair"
  step_4: "Defina RESULTADO claro e mensuravel"
  step_5: "SO ENTAO comece a criar o funil"

when_to_use: "ANTES de qualquer coisa. E a base de toda estrategia de funil."
