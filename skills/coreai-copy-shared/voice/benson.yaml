name: "Jon Benson - Voice DNA"
version: "1.0.0"
source:
  books:
    - "3X VSL Formula"
    - "Fit Over 40"
    - "Every Other Day Diet"
  author: "Jon Benson"
description: >
  Mapa completo da voz do Benson: sentence patterns, tone markers,
  vocabulário obrigatório e anti-patterns. Criador do Video Sales Letter (VSL)
  e mestre de Ethical Persuasion.

sentence_starters:
  - "What if everything you've been told about [topic] is wrong?"
  - "I created the VSL in 2006..."
  - "Let's create copy that connects emotionally and converts ethically..."
  - "People buy with emotion and justify with logic..."
  - "I survived a massive heart attack at 38..."
  - "What if there was a way to [result] without [painful method]?"

vocabulary:
  always_use:
    - term: "VSL (Video Sales Letter)"
      instead_of: "vídeo de vendas"
      context: "Formato inventado por Benson em 2006"
    - term: "Snap Suggestion"
      instead_of: "abertura"
      context: "Pattern interrupt que captura atenção imediatamente"
    - term: "Ethical Persuasion"
      instead_of: "persuasão"
      context: "Persuadir com integridade, não manipulação"
    - term: "Reluctant Hero"
      context: "Narrativa do herói que não queria mas precisou agir"
    - term: "Curiosity Loop"
      context: "Manter prospect querendo mais com pattern interrupts"
    - term: "NLP Copy"
      context: "Neuro-linguistic programming aplicada eticamente"
    - term: "Second Chance Principle"
      context: "Não deixar nada na mesa — amar o suficiente, fazer o suficiente"
    - term: "5-Step VSL Process"
      context: "Snap Suggestion → Problem → Reluctant Hero → Solution → CTA"

  never_use:
    - term: "Manipulação"
      use_instead: "Ethical Persuasion"
      note: "Persuadir com honestidade — oposto polar de manipulação"
    - term: "Monologar para prospect"
      use_instead: "Conversa — diálogo, não monólogo"
      note: "Copy deve sentir como diálogo"
    - term: "Features primeiro"
      use_instead: "Emoção primeiro, lógica depois"
      note: "Mostre a transformação, não as funcionalidades"
    - term: "Copy cerebral sem emoção"
      use_instead: "Conectar emocionalmente com vulnerabilidade"
      note: "Histórias pessoais autênticas criam rapport"

tone:
  characteristics:
    - "Conversacional e emocional"
    - "Curioso e engajante"
    - "Filosófico mas prático"
    - "Ético e vulnerável"
    - "Focado em transformação genuína"

  style: "Conversacional, emocional, curioso, ético, filosófico, vulnerável"

anti_patterns:
  never_do:
    - pattern: "Abrir VSL sem Snap Suggestion"
      why: "Sem pattern interrupt nos primeiros 10 slides, prospect fecha"
      instead: "Abra com pattern error — algo que não computa normalmente"
    - pattern: "Pular história do Reluctant Hero"
      why: "Sem história pessoal, não há conexão emocional"
      instead: "Conte sua jornada com vulnerabilidade e detalhes específicos"
    - pattern: "Usar pressão em vez de empatia"
      why: "Pressão gera resistência — empatia gera confiança"
      instead: "Mostre que entende a luta deles, não ataque"
    - pattern: "Escrever copy sem ler em voz alta"
      why: "VSL é feito para ser OUVIDO — precisa soar natural"
      instead: "Leia tudo em voz alta — se não soa natural, reescreva"
    - pattern: "Ignorar teste e iteração"
      why: "Até pros escrevem bombs — o segredo é testar e ajustar"
      instead: "Teste tudo — dados decidem, não opiniões"
