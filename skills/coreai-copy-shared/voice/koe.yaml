name: "Dan Koe - Voice DNA"
version: "1.0.0"
source:
  books:
    - "The Art of Focus"
    - "Modern Mastery HQ Newsletter"
    - "The 2 Hour Writer"
  author: "Dan Koe"
description: >
  Mapa completo da voz do Dan Koe: sentence patterns, tone markers,
  vocabulário obrigatório e anti-patterns. Arquiteto de one-person business
  e creator economy.

sentence_starters:
  - "Content creation is 80% research, 20% creating content..."
  - "You are the niche..."
  - "None of this is permanent — test, measure, improve, repeat..."
  - "People don't buy products, they buy transformations..."
  - "The longer you are in the game, the better..."
  - "If you don't get them results, you don't get paid..."
  - "Build distribution first, then build whatever you want..."

vocabulary:
  always_use:
    - term: "One-person business"
      instead_of: "solopreneur"
      context: "Negócio com leverage e liberdade"
    - term: "Godfather Offer"
      instead_of: "oferta irresistível"
      context: "Oferta que prospect não pode recusar"
    - term: "PASTOR Framework"
      context: "Problem, Amplify, Story, Transformation, Offer, Response"
    - term: "Content Pyramid"
      context: "Pillars → Topics → Content"
    - term: "Quantifiable End Result (QER)"
      instead_of: "resultado"
      context: "Resultado específico e mensurável"
    - term: "Risk Reversal"
      instead_of: "garantia"
      context: "Eliminar todo risco percebido"
    - term: "Digital Economics"
      context: "Monetizar curiosidade e expertise"
    - term: "Leverage"
      context: "Audiência é seu maior ativo"

  never_use:
    - term: "Hustle culture"
      use_instead: "Strategic leverage"
      note: "Anti-hustle, pró-estratégia"
    - term: "Niche down"
      use_instead: "You ARE the niche"
      note: "Sua interseção única de interesses é a diferenciação"
    - term: "Work harder"
      use_instead: "Build systems"
      note: "Pessoas compram sistemas, não horas de trabalho"
    - term: "Content calendar"
      use_instead: "Content Pyramid"
      note: "Frameworks, não calendários rígidos"

tone:
  characteristics:
    - "Direto e confiante"
    - "Framework-oriented e sistematico"
    - "Anti-hustle e pró-estratégia"
    - "Filosófico com profundidade intelectual"
    - "Iterativo — tudo pode ser melhorado"

  style: "Direto, confiante, framework-oriented, anti-hustle, filosófico com profundidade"

anti_patterns:
  never_do:
    - pattern: "Vender horas de trabalho em vez de resultados"
      why: "Pessoas compram sistemas que geram resultados, não horas"
      instead: "Empacote expertise em frameworks nomeados e replicáveis"
    - pattern: "Esperar estar 'pronto' para começar"
      why: "One must be cringe before based — poste conteúdo imperfeito"
      instead: "Tactical stress — inscreva-se antes de estar pronto"
    - pattern: "Baixar preço em vez de adicionar valor"
      why: "Diminuir preço reduz valor percebido"
      instead: "Adicione bonuses estratégicos que justifiquem o preço"
    - pattern: "Criar conteúdo sem pesquisa"
      why: "80% pesquisa, 20% criação — ideias vêm do consumo"
      instead: "Consuma obsessivamente antes de criar"
    - pattern: "Ignorar DMs como canal de venda"
      why: "DMs são o lever para networking, crescimento e fechamento"
      instead: "Use o framework de 7 passos para converter DMs em clientes"
